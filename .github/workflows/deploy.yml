name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_API_URL здесь не задаётся намеренно: на Pages бэкенда нет,
      # и без этой переменной фронтенд собирается в демо-режиме
      # (src/api/demo.ts) — данные живут в браузере посетителя.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Pages отдаёт 404 на прямых ссылках вида /player/cardio.
      # Копия index.html под именем 404.html возвращает управление роутеру.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

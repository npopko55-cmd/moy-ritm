<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: фон уходит под чёлку и полоску, отступы даём через env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Мой ритм — поток движений под музыку</title>
    <meta name="theme-color" content="#ff2d8e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Шрифты свои: без внешних доменов и без цепочки HTML → CSS → файл. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/montserrat-var-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/montserrat-var-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-var-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-var-latin.woff2" />
    <!-- Главная картинка лендинга: пусть качается сразу, не дожидаясь React. -->
    <link rel="preload" as="image" fetchpriority="high" href="/hero/hero.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

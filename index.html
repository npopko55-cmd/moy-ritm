<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: фон уходит под чёлку и полоску, отступы даём через env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Мой ритм — поток движений под музыку</title>
    <meta name="description" content="Короткие тренировки под музыку: включайте поток и двигайтесь в ритме. В любое время, в любом месте." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Превью ссылки в мессенджерах. Адреса абсолютные: их читают не браузеры, а сборщики превью. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Мой ритм" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Мой ритм — поток движений под музыку" />
    <meta property="og:description" content="Короткие тренировки под музыку: включайте поток и двигайтесь в ритме. В любое время, в любом месте." />
    <meta property="og:url" content="https://ritmritm.ru/" />
    <meta property="og:image" content="https://ritmritm.ru/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#ff2d8e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Шрифты свои: без внешних доменов и без цепочки HTML → CSS → файл. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/montserrat-var-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/montserrat-var-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-var-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-var-latin.woff2" />
    <!-- Постер маскота: он и есть первый экран лендинга, пока не подгрузился ролик. -->
    <link rel="preload" as="image" fetchpriority="high" href="/mascot/warmup-poster.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
